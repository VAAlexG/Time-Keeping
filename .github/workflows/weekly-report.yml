name: Weekly time report

on:
  schedule:
    # Brisbane is UTC+10 year-round: Sunday 14:05 UTC = Monday 00:05 Brisbane.
    - cron: '5 14 * * 0'
  workflow_dispatch:
    inputs:
      week_start:
        description: 'Optional Monday date (YYYY-MM-DD); defaults to the previous week'
        required: false
        type: string
      delivery:
        description: 'Delivery record and recipient to use'
        required: true
        default: test
        type: choice
        options:
          - test
          - scheduled

concurrency:
  group: weekly-time-report
  cancel-in-progress: false

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      WEEKLY_REPORT_RECIPIENT: ${{ secrets.WEEKLY_REPORT_RECIPIENT }}
      REPORT_TEST_RECIPIENT: ${{ secrets.REPORT_TEST_RECIPIENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Send scheduled previous-week report
        if: github.event_name == 'schedule'
        run: npm run report:send
      - name: Send manual test report for selected week
        if: github.event_name == 'workflow_dispatch' && inputs.delivery == 'test' && inputs.week_start != ''
        run: npm run report:test-email -- --week=${{ inputs.week_start }}
      - name: Send manual test report for previous week
        if: github.event_name == 'workflow_dispatch' && inputs.delivery == 'test' && inputs.week_start == ''
        run: npm run report:test-email
      - name: Send manual scheduled report for selected week
        if: github.event_name == 'workflow_dispatch' && inputs.delivery == 'scheduled' && inputs.week_start != ''
        run: npm run report:send -- --week=${{ inputs.week_start }}
      - name: Send manual scheduled report for previous week
        if: github.event_name == 'workflow_dispatch' && inputs.delivery == 'scheduled' && inputs.week_start == ''
        run: npm run report:send
